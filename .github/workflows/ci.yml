name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR code runs without signing credentials or a write token. There is no
# privileged workflow_run/pull_request_target job consuming its artifacts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Core tests
        run: swift test
      - name: Build native macOS without signing
        run: ./scripts/build.sh macos --unsigned
      - name: Build iPhone and iPad for Simulator
        run: ./scripts/build.sh ios
