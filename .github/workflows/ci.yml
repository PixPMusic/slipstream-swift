name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR code runs without signing credentials or a write token. There is no
# privileged workflow_run/pull_request_target job consuming its artifacts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Core tests
        run: swift test
      - name: Check distribution scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/test-preview-changelog.py
          python3 scripts/test-sign-mac-preview.py
      - name: Compile iOS Release without signing
        env:
          SLIPSTREAM_CONFIGURATION: Release
        run: ./scripts/build.sh ios-device CODE_SIGNING_ALLOWED=NO
