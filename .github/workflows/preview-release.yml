name: Preview release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (X.Y.Z)
        required: true
        default: '0.1.0'
        type: string
      build_number:
        description: Positive build number unused on both Apple platforms
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate inputs and check tag is unused
        run: |
          set -euo pipefail
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          tag="v$APP_VERSION-preview.$BUILD_NUMBER"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo 'Tag already exists; use a new build number.' >&2
            exit 1
          fi
      - name: Gather commits since the last published release
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            python3 scripts/preview-changelog.py "$GITHUB_REPOSITORY" > changelog.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-changelog
          path: changelog.md
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 60
    environment: testflight
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    concurrency:
      group: testflight-${{ matrix.platform }}
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      APP_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      PLATFORM: ${{ matrix.platform }}
      SLIPSTREAM_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
      SLIPSTREAM_KEYCHAIN_SERVICE: ${{ vars.KEYCHAIN_SERVICE }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Core tests
        run: swift test
      - name: Install App Store signing credentials
        env:
          DISTRIBUTION_P12_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          MAC_PROFILE_BASE64: ${{ secrets.MAC_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ./scripts/ci-signing.sh install "$PLATFORM"
      - name: Archive once
        env:
          APPLE_SIGNING_IDENTITY: Apple Distribution
        run: |
          if [[ "$PLATFORM" == macos ]]; then
            ./scripts/testflight.sh archive macos 'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO
          else
            ./scripts/testflight.sh archive ios
          fi
      - name: Make preview copy from the archive
        run: ./scripts/preview-release.sh "$PLATFORM"
      - name: Upload the same archive to App Store Connect
        run: ./scripts/testflight.sh upload "$PLATFORM"
      - name: Remove App Store signing credentials
        if: always()
        run: ./scripts/ci-signing.sh cleanup
      - name: Install Developer ID signing credentials
        if: matrix.platform == 'macos'
        env:
          DISTRIBUTION_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ./scripts/ci-signing.sh install-developer-id
      - name: Sign and notarize the Mac preview copy
        if: matrix.platform == 'macos'
        run: ./scripts/sign-mac-preview.sh
      - name: Remove Developer ID signing credentials
        if: always() && matrix.platform == 'macos'
        run: ./scripts/ci-signing.sh cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            build-preview/v${{ inputs.version }}-preview.${{ inputs.build_number }}/*.ipa
            build-preview/v${{ inputs.version }}-preview.${{ inputs.build_number }}/*.zip

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: preview-*
          merge-multiple: true
          path: release
      - name: Publish GitHub prerelease
        run: |
          set -euo pipefail
          tag="v$APP_VERSION-preview.$BUILD_NUMBER"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Slipstream $tag" \
            --notes-file release/changelog.md \
            release/changelog.md release/*.ipa release/*.zip
